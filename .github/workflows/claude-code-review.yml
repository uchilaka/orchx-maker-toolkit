name: Claude Code Review

on:
  # Runs only on request: a PR conversation comment containing "@claude review".
  # issue_comment always runs the workflow file from the default branch, so
  # changes to this file take effect only after they merge to main.
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # issue_comment fires for issues too; `issue.pull_request` limits this to
    # PRs. contains() is case-insensitive. The author_association check keeps
    # drive-by commenters from spending the OAuth token.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    # Optional: also filter by PR author. On issue_comment the PR is
    # `github.event.issue` (not `pull_request`), so `issue.user` is the PR
    # author and `comment.user` is whoever asked for the review. AND this onto
    # the condition above. See docs/claude-github-actions.md.
    # if: |
    #   ... &&
    #   (github.event.issue.user.login == 'external-contributor' ||
    #    github.event.issue.user.login == 'new-developer' ||
    #    github.event.issue.author_association == 'FIRST_TIME_CONTRIBUTOR')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

